apiVersion: v1
kind: Pod
metadata:
  name: c35-node-stats-debug
  namespace: c35
spec:
  restartPolicy: Never
  hostPID: true
  serviceAccountName: c35-node-stats
  imagePullSecrets:
    - name: docker-registry-auth
  containers:
    - name: debug
      image: hsg.ocir.io/axr8wqrrukgm/c35-node-stats:latest
      command:
        - /bin/sh
        - -c
        - |
          wc -c /app/c_node_stats
          cat /app/c_node_stats.sha
          NODE_NAME=10.0.85.142 RUST_LOG=info /app/c_node_stats 2>&1 | head -5 &
          sleep 4
          echo still_running=$?
      envFrom:
        - secretRef:
            name: c35-server-env
        - configMapRef:
            name: c35-node-stats-config
      env:
        - name: NODE_NAME
          value: "10.0.85.142"
        - name: NATS_URL
          value: tls://nats-client.nats.svc.cluster.local:4222
        - name: NATS_CA
          value: /nats-ca/ca.crt
      volumeMounts:
        - name: host-root
          mountPath: /host
          readOnly: true
        - name: nats-ca
          mountPath: /nats-ca
          readOnly: true
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory
    - name: nats-ca
      secret:
        secretName: nats-ca
    - name: tmp
      emptyDir: {}
