apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: c35-node-stats
  namespace: c35
  labels:
    app: c35-node-stats
    app.kubernetes.io/name: c35-node-stats
    app.kubernetes.io/part-of: c35
spec:
  selector:
    matchLabels:
      app: c35-node-stats
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: c35-node-stats
        app.kubernetes.io/name: c35-node-stats
        app.kubernetes.io/part-of: c35
    spec:
      serviceAccountName: c35-node-stats
      hostPID: true
      tolerations:
        - operator: Exists
      imagePullSecrets:
        - name: docker-registry-auth
      containers:
        - name: c-node-stats
          image: hsg.ocir.io/axr8wqrrukgm/c35-node-stats:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: c35-server-env
            - configMapRef:
                name: c35-node-stats-config
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NATS_URL
              value: tls://nats-client.nats.svc.cluster.local:4222
            - name: NATS_CA
              value: /nats-ca/ca.crt
            - name: NO_PROXY
              value: ".svc.cluster.local,.cluster.local,localhost,127.0.0.1"
            - name: RUST_LOG
              value: info,c_node_stats=debug
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
            - name: nats-ca
              mountPath: /nats-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: nats-ca
          secret:
            secretName: nats-ca
        - name: tmp
          emptyDir: {}
