apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searx
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: c35
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: searxng
          image: searxng/searxng:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SEARXNG_BASE_URL
              value: "http://searxng.searx.svc.cluster.local:8080/"
            - name: SEARXNG_SETTINGS_PATH
              value: "/etc/searxng/settings.yml"
            - name: HTTP_PROXY
              value: "http://c35-proxy-cf-warp.c35.svc.cluster.local:8080"
            - name: HTTPS_PROXY
              value: "http://c35-proxy-cf-warp.c35.svc.cluster.local:8080"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.svc.cluster.local,.cluster.local"
          volumeMounts:
            - name: config
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: searxng-config
