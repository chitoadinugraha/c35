apiVersion: v1
kind: Pod
metadata:
  name: buildkit-hostpath-cleanup
  namespace: build
spec:
  nodeSelector:
    kubernetes.io/arch: arm64
    kubernetes.io/hostname: 10.0.85.142
  restartPolicy: Never
  containers:
    - name: cleanup
      image: alpine:3.20
      securityContext:
        privileged: true
      command: ["sh", "-c", "p=/host/var/lib/alienai/buildkit; if [ -d \"$p\" ]; then du -sh \"$p\"; rm -rf \"$p\"/*; rmdir \"$p\" 2>/dev/null || true; echo removed; else echo no_dir; fi; df -h /host"]
      volumeMounts:
        - name: host
          mountPath: /host
  volumes:
    - name: host
      hostPath:
        path: /
        type: Directory