# One-shot copy hostPath -> PVC. Run only while YB is scaled to 0.
apiVersion: batch/v1
kind: Job
metadata:
  name: yb-data-migrate
  namespace: yugabyte
  labels:
    app.kubernetes.io/part-of: yugabyte
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: 10.0.91.240
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36
          command:
            - /bin/sh
            - -ec
            - |
              set -e
              test -d /old-tserver || { echo "missing /old-tserver"; exit 1; }
              test -d /old-master || { echo "missing /old-master"; exit 1; }
              mkdir -p /pvc/tserver /pvc/master
              echo "==> tserver: $(du -sh /old-tserver | cut -f1) -> /pvc/tserver"
              cp -a /old-tserver/. /pvc/tserver/
              echo "==> master: $(du -sh /old-master | cut -f1) -> /pvc/master"
              cp -a /old-master/. /pvc/master/
              echo "==> verify file counts"
              ts_old=$(find /old-tserver -type f | wc -l)
              ts_new=$(find /pvc/tserver -type f | wc -l)
              ms_old=$(find /old-master -type f | wc -l)
              ms_new=$(find /pvc/master -type f | wc -l)
              echo "tserver files: old=$ts_old new=$ts_new"
              echo "master files: old=$ms_old new=$ms_new"
              test "$ts_new" -ge "$ts_old" || exit 1
              test "$ms_new" -ge "$ms_old" || exit 1
              du -sh /pvc/tserver /pvc/master
              echo "==> migrate ok"
          volumeMounts:
            - name: pvc
              mountPath: /pvc
            - name: old-tserver
              mountPath: /old-tserver
              readOnly: true
            - name: old-master
              mountPath: /old-master
              readOnly: true
      volumes:
        - name: pvc
          persistentVolumeClaim:
            claimName: yb-data
        - name: old-tserver
          hostPath:
            path: /var/lib/alienai/yb-tserver
            type: Directory
        - name: old-master
          hostPath:
            path: /var/lib/alienai/yb-master
            type: Directory
