# Re-copy from hostPath backups after a partial migration.
apiVersion: batch/v1
kind: Job
metadata:
  name: yb-data-migrate-backup
  namespace: yugabyte
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: 10.0.91.240
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36
          command:
            - /bin/sh
            - -ec
            - |
              set -e
              test -d /old-tserver || { echo "missing tserver backup"; exit 1; }
              test -d /old-master || { echo "missing master backup"; exit 1; }
              rm -rf /pvc/tserver/* /pvc/master/* /pvc/tserver/.[!.]* /pvc/master/.[!.]* 2>/dev/null || true
              mkdir -p /pvc/tserver /pvc/master
              echo "==> tserver backup -> PVC"
              cp -a /old-tserver/. /pvc/tserver/
              echo "==> master backup -> PVC"
              cp -a /old-master/. /pvc/master/
              du -sh /pvc/tserver /pvc/master /old-tserver /old-master
              echo "==> restore ok"
          volumeMounts:
            - name: pvc
              mountPath: /pvc
            - name: old-tserver
              mountPath: /old-tserver
              readOnly: true
            - name: old-master
              mountPath: /old-master
              readOnly: true
      volumes:
        - name: pvc
          persistentVolumeClaim:
            claimName: yb-data
        - name: old-tserver
          hostPath:
            path: /var/lib/alienai/yb-tserver.hostpath-bak-20260923
            type: Directory
        - name: old-master
          hostPath:
            path: /var/lib/alienai/yb-master.hostpath-bak-20260923
            type: Directory
