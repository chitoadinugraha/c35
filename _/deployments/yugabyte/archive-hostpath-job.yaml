apiVersion: batch/v1
kind: Job
metadata:
  name: yb-hostpath-archive
  namespace: yugabyte
  labels:
    app.kubernetes.io/part-of: yugabyte
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: 10.0.91.240
      restartPolicy: Never
      containers:
        - name: archive
          image: busybox:1.36
          command:
            - /bin/sh
            - -ec
            - |
              set -e
              stamp=$(date +%Y%m%d)
              ts=/alienai/yb-tserver
              ms=/alienai/yb-master
              if [ -d "$ts" ] && [ ! -d "${ts}.hostpath-bak-${stamp}" ]; then mv "$ts" "${ts}.hostpath-bak-${stamp}"; fi
              if [ -d "$ms" ] && [ ! -d "${ms}.hostpath-bak-${stamp}" ]; then mv "$ms" "${ms}.hostpath-bak-${stamp}"; fi
              ls -la /alienai/
          volumeMounts:
            - name: alienai
              mountPath: /alienai
      volumes:
        - name: alienai
          hostPath:
            path: /var/lib/alienai
            type: Directory
