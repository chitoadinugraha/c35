apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c35-server-disk-clean
  labels:
    app.kubernetes.io/name: c35-server
    app.kubernetes.io/part-of: c35
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c35-server-disk-clean
  labels:
    app.kubernetes.io/name: c35-server
    app.kubernetes.io/part-of: c35
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: c35-server-disk-clean
subjects:
  - kind: ServiceAccount
    name: c35-server
    namespace: c35
