apiVersion: apps/v1
kind: Deployment
metadata:
  name: c35-fetcher
  namespace: c35
  labels:
    app.kubernetes.io/name: c35-fetcher
    app.kubernetes.io/part-of: c35
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: c35-fetcher
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c35-fetcher
        app.kubernetes.io/part-of: c35
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      imagePullSecrets:
        - name: docker-registry-auth
      containers:
        - name: c35-fetcher
          image: hsg.ocir.io/axr8wqrrukgm/c35-fetcher:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: c35-server-env
          env:
            - name: YB_DATABASE
              value: c35
            - name: YB_HOST
              value: yb-tservers.yugabyte.svc.cluster.local
            - name: YB_PORT
              value: "5433"
            - name: NATS_URL
              value: tls://nats-client.nats.svc.cluster.local:4222
            - name: NATS_CA
              value: /nats-ca/ca.crt
            - name: FX_MARKUP_BPS
              value: "1000"
            - name: FX_CHANGE_THRESHOLD_BPS
              value: "25"
            - name: FX_FETCH_INTERVAL_SECS
              value: "3600"
            - name: OPENEXCHANGERATES_APP_ID
              value: "bbfbc56fd1ab494dbbc4531e325e6b8b"
            - name: EXTERNAL_FETCHER
              value: "1"
            - name: NO_PROXY
              value: ".svc.cluster.local,.cluster.local,localhost,127.0.0.1"
            - name: RUST_LOG
              value: info,server_fetcher=debug,c35_mod_fetch=debug,c35_mod_billing=info,c35_mod_llm=info,c35_mod_platform=info
            # Platform vendor billing — keys in c35-server-env (envFrom also loads them)
            - name: VENDOR_BILL_FETCH_INTERVAL_SECS
              value: "86400"
            - name: VENDOR_BILL_MTD_ENABLED
              value: "1"
            - name: VENDOR_BILL_FINALIZE_DAYS
              value: "1,3,7,14"
            - name: VENDOR_BILL_STAGGER_MINS
              value: "0,15,30,45"
            - name: VENDOR_BILL_TZ
              value: Asia/Jakarta
            - name: OCI_VENDOR_BILL_ENABLED
              value: "1"
            - name: OCI_PRIVATE_KEY_PATH
              value: /etc/oci/private_key.pem
            - name: GCP_VENDOR_BILL_ENABLED
              valueFrom:
                secretKeyRef:
                  name: c35-server-env
                  key: GCP_VENDOR_BILL_ENABLED
                  optional: true
            - name: GCP_BILLING_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: c35-server-env
                  key: GCP_BILLING_PROJECT_ID
                  optional: true
            - name: GCP_BILLING_DATASET
              valueFrom:
                secretKeyRef:
                  name: c35-server-env
                  key: GCP_BILLING_DATASET
                  optional: true
            - name: GCP_BILLING_TABLE
              valueFrom:
                secretKeyRef:
                  name: c35-server-env
                  key: GCP_BILLING_TABLE
                  optional: true
            - name: GOOGLE_APPLICATION_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: c35-server-env
                  key: GOOGLE_APPLICATION_CREDENTIALS_JSON
                  optional: true
            - name: CF_VENDOR_BILL_ENABLED
              valueFrom:
                secretKeyRef:
                  name: c35-server-env
                  key: CF_VENDOR_BILL_ENABLED
                  optional: true
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: c35-server-env
                  key: CLOUDFLARE_API_TOKEN
                  optional: true
            - name: CLOUDFLARE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: c35-server-env
                  key: CLOUDFLARE_ACCOUNT_ID
                  optional: true
            - name: WASABI_VENDOR_BILL_ENABLED
              valueFrom:
                secretKeyRef:
                  name: c35-server-env
                  key: WASABI_VENDOR_BILL_ENABLED
                  optional: true
            - name: WASABI_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: c35-server-env
                  key: WASABI_ACCESS_KEY
                  optional: true
            - name: WASABI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: c35-server-env
                  key: WASABI_SECRET_KEY
                  optional: true
            - name: WASABI_REGION
              valueFrom:
                secretKeyRef:
                  name: c35-server-env
                  key: WASABI_REGION
                  optional: true
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 64Mi
          volumeMounts:
            - name: nats-ca
              mountPath: /nats-ca
              readOnly: true
            - name: oci-key
              mountPath: /etc/oci
              readOnly: true
      volumes:
        - name: nats-ca
          secret:
            secretName: nats-ca
        - name: oci-key
          secret:
            secretName: oci-api-key
            defaultMode: 0644
