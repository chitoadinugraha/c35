apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config
  labels:
    app: coturn
    app.kubernetes.io/part-of: c35
data:
  turnserver.conf: |
    # c35 WebRTC TURN/STUN (coturn 4.6.3)
    # Port 3479: LiveKit embedded TURN holds host UDP/TCP 3478 on this node.
    listening-port=3479
    listening-ip=0.0.0.0
    relay-ip=0.0.0.0
    external-ip=168.110.203.3
    realm=alienai.id
    fingerprint
    lt-cred-mech
    use-auth-secret
    static-auth-secret-file=/etc/coturn/secret/static-auth-secret
    no-cli
    no-tls
    no-dtls
    no-multicast-peers
    no-loopback-peers
    log-file=stdout
    simple-log
    min-port=49160
    max-port=49260
