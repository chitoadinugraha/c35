syntax = "proto3";

package c35;

import "c35/log.proto";

message AdminUserHit {
  int64 identity_id = 1;
  string name = 2;
  string email = 3;
  string avatar_url = 4;
  string handle = 5;
}

message ReqAdminUserSearch {
  string query = 1;
  int32 limit = 2;
}

message ResAdminUserSearch {
  repeated AdminUserHit users = 1;
}

message AdminUserReferrerBrief {
  int64 identity_id = 1;
  string name = 2;
  string alien_id = 3;
}

message AdminUserRegistrationRow {
  int64 identity_id = 1;
  string name = 2;
  string handle = 3;
  string email = 4;
  int64 registered_ts_ms = 5;
  AdminUserReferrerBrief referred_by = 6;
}

message ReqAdminUserRegistrationsList {
  string preset = 1;
  string since = 2;
  string until = 3;
  bool count_only = 4;
  int32 limit = 5;
  int64 after_registered_ts_ms = 6;
  int64 after_identity_id = 7;
  int64 referred_by_uid = 8;
  string timezone = 9;
}

message ResAdminUserRegistrationsList {
  int64 count = 1;
  repeated AdminUserRegistrationRow users = 2;
  string timezone_used = 3;
  int64 window_start_ms = 4;
  int64 window_end_ms = 5;
  bool has_more = 6;
}

message AdminGlobalRolesPatch {
  repeated string roles = 1;
}

message ReqAdminUserPut {
  int64 target_identity_id = 1;
  optional string name = 2;
  optional string avatar_url = 3;
  optional int64 referred_by_uid = 4;
  optional string handle = 5;
  optional string auth_email = 6;
  optional AdminGlobalRolesPatch global_roles = 7;
}

message ResAdminUserPut {}

message ReqAdminLogList {
  optional int64 owner_iid = 1;
  int64 since_ms = 2;
  int64 until_ms = 3;
  string text = 4;
  optional string kind = 5;
  optional string topic = 6;
  int32 limit = 7;
  optional int64 before_id = 8;
  optional string event_kind = 9;
  optional string class = 10;
  optional string subject_prefix = 11;
  bool exclude_trace = 12;
}

message ResAdminLogList {
  repeated Log logs = 1;
}

// Root-only LLM catalog wholesale + retail ($/1M tokens). Cache column 0 = unknown.
message AdminLlmCatalogRow {
  string id = 1;
  string provider = 2;
  string label = 3;
  string source = 4;
  bool enabled = 5;
  double usd_in_per_1m = 6;
  double usd_in_cache_per_1m = 7;
  double usd_out_per_1m = 8;
  double retail_usd_in_per_1m = 9;
  double retail_usd_in_cache_per_1m = 10;
  double retail_usd_out_per_1m = 11;
}

message ReqAdminLlmCatalogList {
  bool enabled_only = 1;
}

message AdminServiceRateRow {
  string category = 1;
  string id = 2;
  string label = 3;
  string unit = 4;
  double wholesale_usd = 5;
  double retail_usd = 6;
  string detail = 7;
}

message ResAdminLlmCatalogList {
  repeated AdminLlmCatalogRow models = 1;
  double retail_markup = 2;
  repeated AdminServiceRateRow services = 3;
  repeated AdminServiceRateRow live = 4;
}

// Root console — registrations, app activity (WS), settled payments per window.
message PlatformUserMetricsWindowCounts {
  int64 h24 = 1;
  int64 d7 = 2;
  int64 d30 = 3;
  int64 y1 = 4;
}

message ReqAdminPlatformUserMetrics {}

message ResAdminPlatformUserMetrics {
  PlatformUserMetricsWindowCounts users = 1;
  PlatformUserMetricsWindowCounts active_users = 2;
  PlatformUserMetricsWindowCounts paid_users = 3;
  int64 total_users = 4;
}
