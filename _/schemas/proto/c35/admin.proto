syntax = "proto3";

package c35;

import "c35/log.proto";

message AdminUserHit {
  int64 identity_id = 1;
  string name = 2;
  string email = 3;
  string avatar_url = 4;
  string handle = 5;
}

message ReqAdminUserSearch {
  string query = 1;
  int32 limit = 2;
}

message ResAdminUserSearch {
  repeated AdminUserHit users = 1;
}

message AdminGlobalRolesPatch {
  repeated string roles = 1;
}

message ReqAdminUserPut {
  int64 target_identity_id = 1;
  optional string name = 2;
  optional string avatar_url = 3;
  optional int64 referred_by_uid = 4;
  optional string handle = 5;
  optional string auth_email = 6;
  optional AdminGlobalRolesPatch global_roles = 7;
}

message ResAdminUserPut {}

message ReqAdminLogList {
  optional int64 owner_iid = 1;
  int64 since_ms = 2;
  int64 until_ms = 3;
  string text = 4;
  optional string kind = 5;
  optional string topic = 6;
  int32 limit = 7;
  optional int64 before_id = 8;
  optional string event_kind = 9;
  optional string class = 10;
  optional string subject_prefix = 11;
  bool exclude_trace = 12;
}

message ResAdminLogList {
  repeated Log logs = 1;
}

// Root-only LLM catalog wholesale + retail ($/1M tokens). Cache column 0 = unknown.
message AdminLlmCatalogRow {
  string id = 1;
  string provider = 2;
  string label = 3;
  string source = 4;
  bool enabled = 5;
  double usd_in_per_1m = 6;
  double usd_in_cache_per_1m = 7;
  double usd_out_per_1m = 8;
  double retail_usd_in_per_1m = 9;
  double retail_usd_in_cache_per_1m = 10;
  double retail_usd_out_per_1m = 11;
}

message ReqAdminLlmCatalogList {
  bool enabled_only = 1;
}

message AdminServiceRateRow {
  string category = 1;
  string id = 2;
  string label = 3;
  string unit = 4;
  double wholesale_usd = 5;
  double retail_usd = 6;
  string detail = 7;
}

message ResAdminLlmCatalogList {
  repeated AdminLlmCatalogRow models = 1;
  double retail_markup = 2;
  repeated AdminServiceRateRow services = 3;
  repeated AdminServiceRateRow live = 4;
}
