syntax = "proto3";

package c35;

import "c35/log.proto";

// Mirrors ai.chat / chat_member / chat_msg. See _/docs/chat.md
// Home inbox: kind=prompt only. bot_peer on Bots page. direct deferred.

enum ChatKind {
  CHAT_KIND_UNSPECIFIED = 0;
  CHAT_KIND_PROMPT = 1;
  CHAT_KIND_DIRECT = 2;      // deferred — not in Home inbox
  CHAT_KIND_BOT_PEER = 3;
}

enum ChatMsgRole {
  CHAT_MSG_ROLE_UNSPECIFIED = 0;
  CHAT_MSG_ROLE_USER = 1;
  CHAT_MSG_ROLE_ASSISTANT = 2;
  CHAT_MSG_ROLE_SYSTEM = 3;
}

enum ChatMsgSource {
  CHAT_MSG_SOURCE_UNSPECIFIED = 0;
  CHAT_MSG_SOURCE_PROMPT = 1;
  CHAT_MSG_SOURCE_USER = 2;      // direct — deferred
  CHAT_MSG_SOURCE_EXTERNAL = 3;
  CHAT_MSG_SOURCE_STAFF = 4;
}

enum ChatMsgStatus {
  CHAT_MSG_STATUS_UNSPECIFIED = 0;
  CHAT_MSG_STATUS_STREAMING = 1;
  CHAT_MSG_STATUS_DONE = 2;
  CHAT_MSG_STATUS_INTERRUPTED = 3;
  CHAT_MSG_STATUS_ERROR = 4;
}

message Chat {
  int64 id = 1;
  ChatKind kind = 2;
  int64 owner_iid = 3;
  string title = 4;
  repeated string tags = 5;
  string model = 6;

  int64 bot_iid = 7;
  string channel_id = 8;
  string peer_key = 9;
  string peer_name = 10;
  string peer_pic = 11;
  bool ai_reply_enabled = 12;

  int64 last_msg_ts_ms = 13;
  string last_msg_preview = 14;
  string meta_json = 15;

  int64 created_ts_ms = 16;
  int64 updated_ts_ms = 17;
  int64 deleted_ts_ms = 18;
}

message ChatMember {
  int64 chat_id = 1;
  int64 member_iid = 2;
  int64 last_read_msg_id = 3;
  int32 unread_count = 4;
  int64 last_msg_ts_ms = 5;
  string last_msg_preview = 6;
  int64 pinned_ts_ms = 7;
  int64 archived_ts_ms = 8;
  int64 created_ts_ms = 9;
  int64 updated_ts_ms = 10;
  int64 deleted_ts_ms = 11;
  string last_msg_status = 12;
}

message ChatMsg {
  int64 id = 1;
  int64 chat_id = 2;
  int64 owner_iid = 3;
  string req_id = 4;
  int64 sender_iid = 5;
  ChatMsgRole role = 6;
  ChatMsgSource source = 7;
  string content = 8;
  string thought = 9;
  string attachments_json = 10;
  string blocks_json = 11;
  int32 tokens_in = 12;
  int32 tokens_out = 13;
  int32 duration_ms = 14;
  ChatMsgStatus status = 15;
  double cost_usd = 16;          // display; canonical cost on Log
  int64 created_ts_ms = 17;
  int64 updated_ts_ms = 18;
  int64 deleted_ts_ms = 19;
  string error_text = 20;        // post-turn failure; not shown in content
}

// Home inbox (prompt only)
message ReqInboxList {
  bool include_archived = 1;
  int32 limit = 2;
}

message ResInboxList {
  repeated Chat chats = 1;
  repeated ChatMember members = 2;
}

message ReqChatMsgList {
  int64 chat_id = 1;
  int64 before_id = 2;
  int32 limit = 3;
}

message ResChatMsgList {
  repeated ChatMsg messages = 1;
}

// Personal AI prompt stream
message ReqPrompt {
  int64 chat_id = 1;             // 0 = server creates new prompt chat
  string model = 2;
  string text = 3;
  string attachments_json = 4;
  string thinking = 5;
  repeated string mention_ids = 6;
  string topic_id = 7;
  string tool_mode = 8;          // ask | agent
  repeated int64 device_iids = 9;
}

message ResPromptStart {
  int64 chat_id = 1;
  int64 msg_id = 2;
  string model = 3;
}

message ResPromptDelta {
  string text = 1;
  bool thought = 2;
  string blocks_json = 3;
}

message ResPromptEnd {
  int64 msg_id = 1;
  int32 tokens_in = 2;
  int32 tokens_out = 3;
  double cost_usd = 4;
  int32 duration_ms = 5;
  string model = 6;
  string req_id = 7;
  string trace_json = 8;
  string error_message = 9;      // post-turn failure; LLM reply may still be present
}

message ResPromptFail {
  string message = 1;
}

message ReqPromptAbort {
  int64 chat_id = 1;
  string req_id = 2;   // empty = legacy chat-level abort
}

message PromptRunPush {
  string req_id = 1;
  string parent_req_id = 2;
  string kind = 3;
  int64 device_iid = 4;
  string status = 5;
  string label = 6;
  string topic_id = 7;
  int32 turn_count = 8;
  int32 tokens_in = 9;
  int32 tokens_out = 10;
  double cost_usd = 11;
  int32 duration_ms = 12;
  string fail_class = 13;
  string fail_reason = 14;
}

message PromptRunJob {
  string req_id = 1;
  int64 owner_iid = 2;
  int64 chat_id = 3;
}

// bot_peer: stop AI for ONE conversation (not bot / channel)
message ReqChatStop {
  int64 chat_id = 1;
  bool stopped = 2;              // true=stop, false=resume
}

message ResChatStop {
  int64 chat_id = 1;
  bool ai_reply_enabled = 2;
}

// bot_peer: staff manual send
message ReqChatSend {
  int64 chat_id = 1;
  string text = 2;
  string attachments_json = 3;
}

message ResChatSend {
  ChatMsg message = 1;
}

// Home prompt chat: pin, archive, tags, soft-delete (per-user member row + chat metadata)
message TagSet {
  repeated string tags = 1;
}

message ReqChatPatch {
  int64 chat_id = 1;
  optional bool pinned = 2;
  optional bool archived = 3;
  optional TagSet tags = 4;
  optional bool deleted = 5;
}

message ResChatPatch {
  Chat chat = 1;
  ChatMember member = 2;
}

// Home prompt: clear all chat messages for caller (dry_run returns counts only)
message ReqChatHistoryClear {
  bool dry_run = 1;
}

message ResChatHistoryClear {
  int32 msgs_deleted = 1;
  int32 chats_affected = 2;
}

message AssetTagHint {
  string tag = 1;
  int32 count = 2;
}

message ReqAssetTagList {
  string kind = 1;
  string prefix = 2;
  int32 limit = 3;
}

message ResAssetTagList {
  repeated AssetTagHint hints = 1;
}

message ReqLogList {
  string req_id = 1;
  int32 limit = 2;
}

message ResLogList {
  repeated Log logs = 1;
}

message ReqBotPeerList {
  int64 bot_iid = 1;
  bool include_archived = 2;  // reserved; bot_peer uses chat row only for now
  int32 limit = 3;
}

message ResBotPeerList {
  repeated Chat chats = 1;
}
