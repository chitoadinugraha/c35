syntax = "proto3";

package c35;

// Alien AI Drive — see _/specs/drive.md

message DriveFileEntry {
  string path = 1;
  string hash_blake3 = 2;
  int64 size_bytes = 3;
}

message ReqDriveTree {
  string path_prefix = 1; // optional; empty = full tree
}

message ResDriveTree {
  repeated DriveFileEntry files = 1;
}

message ReqDriveUpload {
  string path = 1;
  bytes body = 2;           // inline upload when set
  string hash_blake3 = 3;   // optional: blob already in CAS
}

message ResDriveUpload {
  DriveFileEntry file = 1;
}

message ReqDriveDelete {
  string path = 1;
}

message ResDriveDelete {
  bool ok = 1;
}

message ResDriveStorage {
  int64 storage_used_bytes = 1;
  int64 storage_limit_bytes = 2;
}
