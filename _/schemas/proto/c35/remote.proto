syntax = "proto3";

package c35;

// Human remote viewer (WebRTC). Computer use uses task.proto over server session.
// See _/docs/remote.md

enum RemoteIceType {
  REMOTE_ICE_TYPE_UNSPECIFIED = 0;
  REMOTE_ICE_TYPE_HOST = 1;
  REMOTE_ICE_TYPE_SRFLX = 2;
  REMOTE_ICE_TYPE_RELAY = 3;
}

enum RemoteConnectionMode {
  REMOTE_CONNECTION_MODE_UNSPECIFIED = 0;
  REMOTE_CONNECTION_MODE_DIRECT = 1;   // host or srflx
  REMOTE_CONNECTION_MODE_RELAY = 2;
}

// ---------------------------------------------------------------------------
// WebRTC signaling (WS — server relays to agent session)
// ---------------------------------------------------------------------------

message ReqRemoteSessionStart {
  int64 device_iid = 1;
  string session_id = 2;      // client-generated ULID per viewer session
}

message ResRemoteSessionStart {
  bool ok = 1;
  string error = 2;
  string session_id = 3;
}

message RtcSignalOffer {
  int64 device_iid = 1;
  string session_id = 2;
  string sdp = 3;
}

message RtcSignalAnswer {
  int64 device_iid = 1;
  string session_id = 2;
  string sdp = 3;
}

message RtcSignalIce {
  int64 device_iid = 1;
  string session_id = 2;
  string candidate = 3;
  string sdp_mid = 4;
  uint32 sdp_mline_index = 5;
}

message ReqRemoteSessionStop {
  int64 device_iid = 1;
  string session_id = 2;
}

message ResRemoteSessionStop {
  bool ok = 1;
}

// Unsolicited: connection stats for Direct / Relay badge
message RemoteSessionPush {
  int64 device_iid = 1;
  string session_id = 2;
  RemoteConnectionMode mode = 3;
  RemoteIceType selected_ice = 4;
  bool video_active = 5;
  bool webrtc_connected = 6;    // data plane up (Files / Remote tabs)
  bool update_ready = 7;        // true if background download is finished and staged
  int64 update_version = 8;     // target version build number
}

// ---------------------------------------------------------------------------
// ICE / TURN config (WS — server mints ephemeral credentials)
// ---------------------------------------------------------------------------

message IceServer {
  repeated string urls = 1;
  string username = 2;
  string credential = 3;
}

message ReqRemoteIceConfig {}

message ResRemoteIceConfig {
  repeated IceServer ice_servers = 1;
  uint32 ttl_sec = 2;
}

// ---------------------------------------------------------------------------
// Remote screenshot capture (Agent control session RPC)
// ---------------------------------------------------------------------------

message ReqRemoteScreenshot {
  int64 device_iid = 1;
  uint32 max_width = 2; // e.g. 1280 or 1920 (0 = default 1280)
  uint32 quality = 3;   // e.g. 72 (0 = default 72)
  double marker_x = 4;  // normalized 0..1 (if > 0, draw red action marker at click point)
  double marker_y = 5;  // normalized 0..1
  bool som = 6;         // if true, overlays Set-of-Mark (@1, @2, ...) bounding boxes and returns axtree_text
}

message ResRemoteScreenshot {
  bool ok = 1;
  string error = 2;
  uint32 width = 3;
  uint32 height = 4;
  bytes jpeg_bytes = 5;
  string axtree_text = 6; // list of actionable UI elements with exact coordinates
}

// ---------------------------------------------------------------------------
// Remote command execution RPC
// ---------------------------------------------------------------------------

message ReqRemoteCommand {
  int64 device_iid = 1;
  string command = 2;
  uint32 timeout_sec = 3;
}

message ResRemoteCommand {
  bool ok = 1;
  string error = 2;
  int32 exit_code = 3;
  string stdout = 4;
  string stderr = 5;
}

// App → server → agent WS text push (e.g. c35.browser.mode:background).
message ReqRemoteAgentPush {
  int64 device_iid = 1;
  string payload = 2;
}

message ResRemoteAgentPush {
  bool ok = 1;
  string error = 2;
}

// App → server → agent browser engine RPC (__c35_browser__ JSON command).
message ReqRemoteBrowserInvoke {
  int64 device_iid = 1;
  string method = 2;
  string params_json = 3;
  uint32 timeout_sec = 4;
}

message ResRemoteBrowserInvoke {
  bool ok = 1;
  string error = 2;
  string result_json = 3;
}

// ---------------------------------------------------------------------------
// Remote filesystem list/read (agent control session RPC — not WebRTC)
// ---------------------------------------------------------------------------

message ReqRemoteFsList {
  int64 device_iid = 1;
  string path = 2; // empty = list drive roots
}

message ReqRemoteFsRead {
  int64 device_iid = 1;
  string path = 2;
  int64 offset = 3;
  int32 max_bytes = 4; // 0 = agent default; server caps for LLM tools
}

// ---------------------------------------------------------------------------
// WebRTC data channel payloads (binary frame = protobuf encode)
// ---------------------------------------------------------------------------

message RemoteInputEvent {
  string event_type = 1;      // mouse_move | mouse_down | mouse_up | mouse_click | wheel | key_down | key_up | type_text
  double x = 2;               // normalized 0..1
  double y = 3;
  int32 button = 4;           // 0=left 1=middle 2=right
  int32 key_code = 5;
  string text = 6;
  int32 delta_y = 7;          // wheel
}

// Agent → viewer on `remote-input` (viewer sends RemoteInputEvent only).
message RemoteCursorEvent {
  string shape = 1; // arrow | text | click | wait | progress | help | forbidden | move | precise | resize_ns | resize_ew | resize_nesw | resize_nwse
}

// Viewer → agent on `remote-screen` (MJPEG stream tuning; not CS35/CS36 frame packets).
message RemoteScreenControl {
  uint32 quality = 1; // JPEG 40..95 (0 = ignore)
}

// ---------------------------------------------------------------------------
// WebRTC data channel `remote-fs` (binary frame = protobuf encode)
// ---------------------------------------------------------------------------

enum RemoteFsDriveKind {
  REMOTE_FS_DRIVE_KIND_UNSPECIFIED = 0;
  REMOTE_FS_DRIVE_KIND_FIXED = 1;
  REMOTE_FS_DRIVE_KIND_REMOVABLE = 2;
  REMOTE_FS_DRIVE_KIND_REMOTE = 3;
  REMOTE_FS_DRIVE_KIND_CDROM = 4;
  REMOTE_FS_DRIVE_KIND_RAM = 5;
}

message RemoteFsEntry {
  string name = 1;
  string path = 2;
  bool is_dir = 3;
  int64 size = 4;
  int64 modified_ms = 5;
  RemoteFsDriveKind drive_kind = 6;
}

message RemoteFsListReq {
  string path = 1;
}

message RemoteFsListRes {
  repeated RemoteFsEntry entries = 1;
  string error = 2;
}

message RemoteFsReadReq {
  string path = 1;
  int64 offset = 2;
  int32 length = 3;
}

message RemoteFsReadRes {
  bytes data = 1;
  bool eof = 2;
  string mime = 3;
  string error = 4;
}

message RemoteFsWriteReq {
  string path = 1;
  int64 offset = 2;
  bytes data = 3;
  bool finalize = 4;
}

message RemoteFsWriteRes {
  int64 bytes_written = 1;
  string error = 2;
}

// path is field 2 (not 1) so frames differ from RemoteFsListReq on the wire.
message RemoteFsMkdirReq {
  string path = 2;
}

message RemoteFsMkdirRes {
  string error = 1;
}

// path is field 5 so frames differ from list/read/write tags.
message RemoteFsDeleteReq {
  string path = 5;
}

message RemoteFsDeleteRes {
  string error = 1;
}

message RemoteFsRenameReq {
  string from_path = 1;
  string to_path = 2;
}

message RemoteFsRenameRes {
  string error = 1;
}

// ---------------------------------------------------------------------------
// WebRTC data channel `remote-fs` — file media (H.264 on existing video track)
// Field tags 21–23 avoid collision with RemoteFs* request shapes.
// ---------------------------------------------------------------------------

enum RemoteMediaState {
  REMOTE_MEDIA_STATE_UNSPECIFIED = 0;
  REMOTE_MEDIA_STATE_IDLE = 1;
  REMOTE_MEDIA_STATE_OPENING = 2;
  REMOTE_MEDIA_STATE_PLAYING = 3;
  REMOTE_MEDIA_STATE_ERROR = 4;
}

enum RemoteMediaEncoder {
  REMOTE_MEDIA_ENCODER_UNSPECIFIED = 0;
  REMOTE_MEDIA_ENCODER_HW_MF = 1;
  REMOTE_MEDIA_ENCODER_FFMPEG = 2;
}

message RemoteMediaOpenReq {
  string path = 21;
}

message RemoteMediaOpenRes {
  bool ok = 1;
  string error = 2;
  RemoteMediaState state = 3;
  RemoteMediaEncoder encoder = 4;
}

message RemoteMediaCloseReq {
  bool close = 22;
}

message RemoteMediaCloseRes {
  bool ok = 1;
  string error = 2;
  RemoteMediaState state = 3;
}

message RemoteMediaStatusReq {
  bool query = 23;
}

message RemoteMediaStatusRes {
  RemoteMediaState state = 1;
  string path = 2;
  string error = 3;
  RemoteMediaEncoder encoder = 4;
}

// ---------------------------------------------------------------------------
// WebRTC data channel `remote-teach` (binary frame = protobuf encode)
// Field tags 31–34 avoid collision with RemoteFs* / RemoteMedia* shapes.
// ---------------------------------------------------------------------------

message RemoteTeachStep {
  int32 ord = 1;
  string kind = 2;
  string label = 3;
  string ax_target_json = 4;
}

message RemoteTeachStartReq {
  string title = 1;
  int64 device_iid = 2;
}

message RemoteTeachStartRes {
  bool ok = 1;
  string error = 2;
}

message RemoteTeachStopReq {
  bool stop = 31;
}

message RemoteTeachStopRes {
  repeated RemoteTeachStep steps = 1;
  string error = 2;
}

message RemoteTeachStatusReq {
  bool poll = 32;
}

message RemoteTeachStatusRes {
  bool recording = 1;
  repeated RemoteTeachStep steps = 2;
  uint64 duration_sec = 3;
  string last_label = 4;
  string error = 5;
}
