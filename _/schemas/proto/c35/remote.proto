syntax = "proto3";

package c35;

// Human remote viewer (WebRTC). Computer use uses task.proto over server session.
// See _/docs/remote.md

enum RemoteIceType {
  REMOTE_ICE_TYPE_UNSPECIFIED = 0;
  REMOTE_ICE_TYPE_HOST = 1;
  REMOTE_ICE_TYPE_SRFLX = 2;
  REMOTE_ICE_TYPE_RELAY = 3;
}

enum RemoteConnectionMode {
  REMOTE_CONNECTION_MODE_UNSPECIFIED = 0;
  REMOTE_CONNECTION_MODE_DIRECT = 1;   // host or srflx
  REMOTE_CONNECTION_MODE_RELAY = 2;
}

// ---------------------------------------------------------------------------
// WebRTC signaling (WS — server relays to agent session)
// ---------------------------------------------------------------------------

message ReqRemoteSessionStart {
  int64 device_iid = 1;
  string session_id = 2;      // client-generated ULID per viewer session
}

message ResRemoteSessionStart {
  bool ok = 1;
  string error = 2;
  string session_id = 3;
}

message RtcSignalOffer {
  int64 device_iid = 1;
  string session_id = 2;
  string sdp = 3;
}

message RtcSignalAnswer {
  int64 device_iid = 1;
  string session_id = 2;
  string sdp = 3;
}

message RtcSignalIce {
  int64 device_iid = 1;
  string session_id = 2;
  string candidate = 3;
  string sdp_mid = 4;
  uint32 sdp_mline_index = 5;
}

message ReqRemoteSessionStop {
  int64 device_iid = 1;
  string session_id = 2;
}

message ResRemoteSessionStop {
  bool ok = 1;
}

// Unsolicited: connection stats for Direct / Relay badge
message RemoteSessionPush {
  int64 device_iid = 1;
  string session_id = 2;
  RemoteConnectionMode mode = 3;
  RemoteIceType selected_ice = 4;
  bool video_active = 5;
  bool webrtc_connected = 6;    // data plane up (Files / Remote tabs)
  bool update_ready = 7;        // true if background download is finished and staged
  int64 update_version = 8;     // target version build number
}

// ---------------------------------------------------------------------------
// ICE / TURN config (WS — server mints ephemeral credentials)
// ---------------------------------------------------------------------------

message IceServer {
  repeated string urls = 1;
  string username = 2;
  string credential = 3;
}

message ReqRemoteIceConfig {}

message ResRemoteIceConfig {
  repeated IceServer ice_servers = 1;
  uint32 ttl_sec = 2;
}

// ---------------------------------------------------------------------------
// Remote screenshot capture (Agent control session RPC)
// ---------------------------------------------------------------------------

message ReqRemoteScreenshot {
  int64 device_iid = 1;
  uint32 max_width = 2; // e.g. 1280 or 1920 (0 = default 1280)
  uint32 quality = 3;   // e.g. 72 (0 = default 72)
  double marker_x = 4;  // normalized 0..1 (if > 0, draw red action marker at click point)
  double marker_y = 5;  // normalized 0..1
  bool som = 6;         // if true, overlays Set-of-Mark (@1, @2, ...) bounding boxes and returns axtree_text
}

message ResRemoteScreenshot {
  bool ok = 1;
  string error = 2;
  uint32 width = 3;
  uint32 height = 4;
  bytes jpeg_bytes = 5;
  string axtree_text = 6; // list of actionable UI elements with exact coordinates
}

// ---------------------------------------------------------------------------
// Remote command execution RPC
// ---------------------------------------------------------------------------

message ReqRemoteCommand {
  int64 device_iid = 1;
  string command = 2;
  uint32 timeout_sec = 3;
}

message ResRemoteCommand {
  bool ok = 1;
  string error = 2;
  int32 exit_code = 3;
  string stdout = 4;
  string stderr = 5;
}

// ---------------------------------------------------------------------------
// WebRTC data channel payloads (binary frame = protobuf encode)
// ---------------------------------------------------------------------------

message RemoteInputEvent {
  string event_type = 1;      // mouse_move | mouse_down | mouse_up | mouse_click | wheel | key_down | key_up | type_text
  double x = 2;               // normalized 0..1
  double y = 3;
  int32 button = 4;           // 0=left 1=middle 2=right
  int32 key_code = 5;
  string text = 6;
  int32 delta_y = 7;          // wheel
}

// ---------------------------------------------------------------------------
// WebRTC data channel `remote-fs` (binary frame = protobuf encode)
// ---------------------------------------------------------------------------

enum RemoteFsDriveKind {
  REMOTE_FS_DRIVE_KIND_UNSPECIFIED = 0;
  REMOTE_FS_DRIVE_KIND_FIXED = 1;
  REMOTE_FS_DRIVE_KIND_REMOVABLE = 2;
  REMOTE_FS_DRIVE_KIND_REMOTE = 3;
  REMOTE_FS_DRIVE_KIND_CDROM = 4;
  REMOTE_FS_DRIVE_KIND_RAM = 5;
}

message RemoteFsEntry {
  string name = 1;
  string path = 2;
  bool is_dir = 3;
  int64 size = 4;
  int64 modified_ms = 5;
  RemoteFsDriveKind drive_kind = 6;
}

message RemoteFsListReq {
  string path = 1;
}

message RemoteFsListRes {
  repeated RemoteFsEntry entries = 1;
  string error = 2;
}

message RemoteFsReadReq {
  string path = 1;
  int64 offset = 2;
  int32 length = 3;
}

message RemoteFsReadRes {
  bytes data = 1;
  bool eof = 2;
  string mime = 3;
  string error = 4;
}

message RemoteFsWriteReq {
  string path = 1;
  int64 offset = 2;
  bytes data = 3;
  bool finalize = 4;
}

message RemoteFsWriteRes {
  int64 bytes_written = 1;
  string error = 2;
}
