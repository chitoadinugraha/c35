syntax = "proto3";

package c35;

import "c35/referral.proto";

// Mirrors ai.billing_* tables. See _/docs/billing.md
// v2 types (BillingProfile, BillingWallet, …) — Phase 2 wire; legacy BillingAccount kept until migration.

// ------------------------------------------------------------------------------
// v2 (target wire — Phase 2)
// ------------------------------------------------------------------------------

message BillingProfile {
  int64 id = 1;
  int64 owner_iid = 2;
  string plan_tier = 3;
  string default_wallet_currency = 4;

  double alien_allow_5h_used = 5;
  double alien_allow_5h_limit = 6;
  double alien_allow_weekly_used = 7;
  double alien_allow_weekly_limit = 8;
  int64 window_5h_start_ms = 9;
  int64 window_weekly_start_ms = 10;

  double commission_available_usd = 11;
  double commission_earned_usd = 12;
  double commission_available_idr = 13;
  double commission_earned_idr = 14;

  int64 updated_ts_ms = 15;
}

message BillingWallet {
  int64 id = 1;
  int64 owner_iid = 2;
  string currency = 3;
  double balance = 4;
  bool is_default = 5;
  string name = 6;
  int64 updated_ts_ms = 7;
}

message BillingPlanPrice {
  string plan_slug = 1;
  string currency = 2;
  double amount = 3;
  string billing_period = 4;
}

message BillingFxRate {
  int64 id = 1;
  string currency = 2;
  int64 micro_per_usd = 3;
  int64 effective_from_ms = 4;
}

message BillingPurchase {
  int64 id = 1;
  int64 owner_iid = 2;
  string plan_slug = 3;
  string currency = 4;
  double amount = 5;
  string provider = 6;
  string status = 7;
  string scope = 8;
  int64 scope_iid = 9;
  int64 settled_ts_ms = 10;
  int64 created_ts_ms = 11;
}

// Session init snapshot (replaces single BillingAccount when v2 live)
message BillingSnapshot {
  BillingProfile profile = 1;
  repeated BillingWallet wallets = 2;
}

// ------------------------------------------------------------------------------
// LEGACY (dual USD/IDR — remove after Phase 6)
// ------------------------------------------------------------------------------

message BillingAccount {
  int64 id = 1;
  int64 owner_iid = 2;
  string name = 3;

  double balance_usd = 4;
  double balance_idr = 5;
  string plan_tier = 6;

  double alien_allow_5h_used = 7;
  double alien_allow_5h_limit = 8;
  double alien_allow_weekly_used = 9;
  double alien_allow_weekly_limit = 10;
  int64 window_5h_start_ms = 11;
  int64 window_weekly_start_ms = 12;

  string billing_currency = 13;
  int64 fx_micro_per_usd = 14;

  double commission_available_usd = 15;
  double commission_earned_usd = 16;
  double commission_available_idr = 17;
  double commission_earned_idr = 18;

  string meta_json = 19;
  int64 created_ts_ms = 20;
  int64 updated_ts_ms = 21;
  int64 deleted_ts_ms = 22;
}

message BillingTopupRequest {
  int64 id = 1;
  int64 owner_iid = 2;
  int64 billing_account_id = 3;
  double amount_usd = 4;
  double amount_idr = 5;
  string provider = 6;
  string payment_type = 7;
  string external_order_id = 8;
  string proof_url = 9;
  string status = 10;
  string reject_reason = 11;
  int64 reviewed_by_iid = 12;
  int64 settled_ts_ms = 13;
  int64 created_ts_ms = 14;
  int64 updated_ts_ms = 15;
}

// NATS push: c35.user.{iid}.balance | .quota | .commission
message BillingPushBalance {
  int64 billing_account_id = 1;  // legacy
  double balance_usd = 2;        // legacy
  double balance_idr = 3;        // legacy
  int64 updated_ts_ms = 4;
  // v2 fields (populate when wallet model live)
  int64 wallet_id = 5;
  string currency = 6;
  double balance = 7;
}

message BillingPushQuota {
  double alien_allow_5h_used = 1;
  double alien_allow_5h_limit = 2;
  double alien_allow_weekly_used = 3;
  double alien_allow_weekly_limit = 4;
  int64 window_5h_start_ms = 5;
  int64 window_weekly_start_ms = 6;
}

message BillingPushCommission {
  double commission_available_usd = 1;
  double commission_earned_usd = 2;
  double commission_available_idr = 3;
  double commission_earned_idr = 4;
}

// Invoke (HTTP or Ws invoke) — user submit top-up
message ReqBillingTopupPut {
  double amount_usd = 1;
  double amount_idr = 2;
  string provider = 3;
  string payment_type = 4;
  string proof_url = 5;
}

message ResBillingTopupPut {
  BillingTopupRequest request = 1;
}

message ReqBillingPlanSubscribe {
  string plan_slug = 1;
  string currency = 2;       // v2: checkout currency (default = profile.default_wallet_currency)
  int64 wallet_id = 3;       // v2: 0 = default wallet; debit wallet path
  bool direct_purchase = 4;  // v2: true = billing_purchase flow, skip wallet debit
}

message ResBillingPlanSubscribe {
  string plan_tier = 1;
  double balance_usd = 2;
  double balance_idr = 3;
  double alien_allow_5h_limit = 4;
  double alien_allow_weekly_limit = 5;
}

message ReqBillingPackageRedeem {
  string code = 1;
}

message ResBillingPackageRedeem {
  int64 purchase_id = 1;
  double amount_usd = 2;
  double amount_idr = 3;
  string plan_tier = 4;
  int32 duration_months = 5;
  string package_name = 6;
}

message ReqBillingPackagePreview {
  string code = 1;
}

message ResBillingPackagePreview {
  double amount_usd = 1;
  double amount_idr = 2;
  string plan_tier = 3;
  string package_name = 4;
  ResReferralCommissionSimulate commission = 5;
}

message BotUsageModelRow {
  string model = 1;
  string plan_slug = 2;
  int32 turns = 3;
  int32 tokens_in = 4;
  int32 tokens_out = 5;
  double cost_usd = 6;
}

message ReqBotUsageStats {
  int64 bot_iid = 1;
}

message ResBotUsageStats {
  int64 bot_iid = 1;
  string plan_slug = 2;
  int32 msgs_used = 3;
  int32 msgs_limit = 4;
  double total_cost_usd = 5;
  int32 total_tokens_in = 6;
  int32 total_tokens_out = 7;
  repeated BotUsageModelRow by_model = 8;
}

message ReqBillingSummary {
  int64 billing_account_id = 1; // 0 = default for caller
}

message BillingPlanDoc {
  string slug = 1;
  string name = 2;
  int32 sort_order = 3;
  double price_usd = 4;
  int32 duration_months = 5;
  double alien_allow_5h_usd = 6;
  double alien_allow_weekly_usd = 7;
  int32 msgs_limit = 8;
  int32 channels_limit = 9;
  int32 concurrent_limit = 10;
  bool overage_enabled = 11;
}

message BillingHistoryRow {
  string kind = 1;
  string title = 2;
  double amount_usd = 3;  // legacy
  double amount_idr = 4;  // legacy
  string status = 5;
  int64 ts_ms = 6;
  string currency = 7;
  double amount = 8;        // signed native amount in currency
}

message ReqBillingHistory {
  int32 limit = 1;
  string currency = 2;    // ISO 4217 filter (IDR, USD, …)
}

message ResBillingHistory {
  repeated BillingHistoryRow rows = 1;
}

message ResBillingSummary {
  double balance_usd = 1;
  string plan_tier = 2;
  int32 quota_5h_used = 3;
  int32 quota_5h_limit = 4;
  int64 window_5h_resets_at_ms = 5;
  string meter_state = 6;
  bool bots_paused = 7;
  int32 quota_weekly_used = 8;
  int32 quota_weekly_limit = 9;
  int64 window_weekly_resets_at_ms = 10;
  double balance_idr = 11;
  double commission_available_usd = 12;
  double commission_available_idr = 13;
  double alien_allow_5h_used = 14;
  double alien_allow_5h_limit = 15;
  double alien_allow_weekly_used = 16;
  double alien_allow_weekly_limit = 17;
  repeated BillingPlanDoc plans = 18;
  bool overage_enabled = 19;
}
