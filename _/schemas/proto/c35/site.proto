syntax = "proto3";

package c35;

// Site = identity(kind=site) + site.* payload tables (YSQL schema site).
// Guest layout = block-composed SiteDoc. Admin = UITable + prompt. See _/docs/site.md

// ================================= Doc (presentation — not fixed CSA sections)

message SiteBlock {
  string id = 1;
  string type = 2;              // hero | markdown | image | gallery | links | product_grid | contact_form | map | hours | queue | embed | spacer | custom_html
  string props_json = 3;
}

message SitePage {
  string path = 1;              // e.g. "/" or "/about"
  string title = 2;
  repeated SiteBlock blocks = 3;
}

message SiteDoc {
  repeated SitePage pages = 1;
  string theme_json = 2;        // fonts, colors, layout tokens
  string meta_json = 3;         // seo, favicon, og tags
}

// ================================= Rows

message SiteConfig {
  int64 site_iid = 1;
  int64 owner_iid = 2;
  string published_version_id = 3;
  string inventory_costing_method = 4;
  string tz = 5;
  string payroll_policy_json = 6;
  string presence_policy_json = 7;
  string capabilities_json = 8;
  int64 alien_id_changed_ts_ms = 9;

  int64 created_ts_ms = 20;
  int64 updated_ts_ms = 21;
  int64 deleted_ts_ms = 22;
}

message SiteDomain {
  int64 id = 1;
  int64 site_iid = 2;
  string hostname = 3;
  bool is_primary = 4;
  string tls_status = 5;
  int64 verified_ts_ms = 6;
  string verify_token = 7;
  string verify_error = 8;
  string tls_error = 9;
  int64 last_verify_ts_ms = 10;
  string source = 11;       // byo | bought
  string mail_status = 12;  // empty | pending | ready | failed
  string mail_error = 13;

  int64 created_ts_ms = 20;
  int64 updated_ts_ms = 21;
  int64 deleted_ts_ms = 22;
}

message SiteDraft {
  int64 site_iid = 1;
  int64 owner_iid = 2;
  SiteDoc doc = 3;

  int64 created_ts_ms = 20;
  int64 updated_ts_ms = 21;
  int64 deleted_ts_ms = 22;
}

message SitePublish {
  int64 site_iid = 1;
  string version_id = 2;
  SiteDoc doc = 3;
  string render_hash = 4;
  int64 published_ts_ms = 5;
  bool is_active = 6;

  int64 created_ts_ms = 20;
  int64 updated_ts_ms = 21;
  int64 deleted_ts_ms = 22;
}

message SiteProduct {
  int64 site_iid = 1;
  int64 product_id = 2;
  int32 type = 3;
  string name = 4;
  string desc = 5;
  string unit = 6;
  string sku = 7;
  int64 rev = 8;

  bool can_sell = 9;
  bool can_reserve = 10;
  bool track_stock = 11;
  int32 stock_qty = 12;
  int64 price = 13;
  string pic = 14;
  string category = 15;
  string product_json = 16;
  bool is_archived = 17;
  int32 sort_order = 19;

  int64 created_ts_ms = 20;
  int64 updated_ts_ms = 21;
  int64 deleted_ts_ms = 22;
  string icon = 23; // iconify id when pic is empty; empty when pic is set
}

message SiteProductEmbed {
  int64 site_iid = 1;
  int64 embed_id = 2;
  int64 product_id = 3;
  string label = 4;

  int64 created_ts_ms = 20;
  int64 updated_ts_ms = 21;
  int64 deleted_ts_ms = 22;
}

message SiteContact {
  int64 site_iid = 1;
  int64 contact_id = 2;
  string name = 3;
  string phone = 4;
  string email = 5;
  string address = 6;
  string note = 7;
  string meta_json = 8;
  bool is_archived = 9;

  int64 created_ts_ms = 20;
  int64 updated_ts_ms = 21;
  int64 deleted_ts_ms = 22;
}

message SiteLink {
  int64 site_iid = 1;
  int64 link_id = 2;
  int32 sort_order = 3;
  string label = 4;
  string url = 5;
  string icon = 6;
  bool is_pinned = 7;
  bool active = 8;

  int64 created_ts_ms = 20;
  int64 updated_ts_ms = 21;
  int64 deleted_ts_ms = 22;
}

message SitePost {
  int64 site_iid = 1;
  int64 post_id = 2;
  int32 sort_order = 3;
  string title = 4;
  string caption = 5;
  string body = 6;
  string media_json = 7;
  bool on_storefront = 8;
  string thumb = 9;
  string feed_kind = 10;

  int64 created_ts_ms = 20;
  int64 updated_ts_ms = 21;
  int64 deleted_ts_ms = 22;
}

message SiteObject {
  int64 id = 1;
  int64 site_iid = 2;
  string client_id = 3;
  string name = 4;
  string code = 5;
  string kind = 6;
  int64 product_id = 7;
  bool can_order = 8;
  bool can_be_reserved = 9;
  bool is_active = 10;
  string desc = 11;
  string pic = 12;
  string meta_json = 13;

  int64 created_ts_ms = 20;
  int64 updated_ts_ms = 21;
  int64 deleted_ts_ms = 22;
}

message SiteRow {
  int64 site_iid = 1;
  string alien_id = 2;
  string name = 3;
  string pic = 4;
  string published_version_id = 5;
  int64 updated_ts_ms = 6;
  bool is_archived = 7;
  bool is_pinned = 8;
  int32 sort_order = 9;
}

// ================================= API

message ReqSiteList {
  bool archived = 1;
}

message ResSiteList {
  repeated SiteRow sites = 1;
  int32 archived_count = 2;
}

message ReqSiteDraftGet {
  int64 site_iid = 1;
}

message ResSiteDraftGet {
  SiteDraft draft = 1;
  SiteConfig config = 2;
}

message ReqSiteDraftPut {
  SiteDraft draft = 1;
  bool skip_publish = 2;
}

message ResSiteDraftPut {
  int64 site_iid = 1;
}

message ReqSiteConfigPut {
  int64 site_iid = 1;
  string capabilities_json = 2;
}

message ResSiteConfigPut {
  SiteConfig config = 1;
}

message ReqSitePublish {
  int64 site_iid = 1;
}

message ResSitePublish {
  SitePublish publish = 1;
}

message ReqSiteProductList {
  int64 site_iid = 1;
}

message ResSiteProductList {
  repeated SiteProduct products = 1;
}

message ReqSiteProductPut {
  int64 site_iid = 1;
  SiteProduct product = 2;
}

message ResSiteProductPut {
  int64 product_id = 1;
  string icon = 2; // iconify id when pic is empty; empty when pic is set
}

message ReqSiteProductDelete {
  int64 site_iid = 1;
  int64 product_id = 2;
}

message ResSiteProductDelete {
  int64 product_id = 1;
  bool ok = 2;
}

message SiteProductReorderEntry {
  int64 product_id = 1;
  int32 sort_order = 2;
}

message ReqSiteProductReorder {
  int64 site_iid = 1;
  repeated SiteProductReorderEntry entries = 2;
}

message ResSiteProductReorder {
  bool ok = 1;
}

message ReqSiteContactList {
  int64 site_iid = 1;
  string q = 2;
}

message ResSiteContactList {
  repeated SiteContact contacts = 1;
}

message ReqSiteContactPut {
  int64 site_iid = 1;
  SiteContact contact = 2;
}

message ResSiteContactPut {
  int64 contact_id = 1;
}

message ReqSiteLinkList {
  int64 site_iid = 1;
}

message ResSiteLinkList {
  repeated SiteLink links = 1;
}

message ReqSiteLinkPut {
  int64 site_iid = 1;
  SiteLink link = 2;
}

message ResSiteLinkPut {
  int64 link_id = 1;
}

message ReqSiteLinkDelete {
  int64 site_iid = 1;
  int64 link_id = 2;
}

message ResSiteLinkDelete {
  int64 link_id = 1;
  bool ok = 2;
}

message ReqSitePostList {
  int64 site_iid = 1;
}

message ResSitePostList {
  repeated SitePost posts = 1;
}

message ReqSitePostPut {
  int64 site_iid = 1;
  SitePost post = 2;
}

message ResSitePostPut {
  int64 post_id = 1;
}

message ReqSitePostDelete {
  int64 site_iid = 1;
  int64 post_id = 2;
}

message ResSitePostDelete {
  int64 post_id = 1;
  bool ok = 2;
}

message ReqSiteObjectList {
  int64 site_iid = 1;
}

message ResSiteObjectList {
  repeated SiteObject objs = 1;
}

message ReqSiteObjectPut {
  int64 site_iid = 1;
  SiteObject obj = 2;
}

message ResSiteObjectPut {
  int64 id = 1;
}

message ReqSiteDomainList {
  int64 site_iid = 1;
}

message ResSiteDomainList {
  repeated SiteDomain domains = 1;
}

message ReqSiteDomainPut {
  int64 site_iid = 1;
  SiteDomain domain = 2;
}

message ResSiteDomainPut {
  int64 id = 1;
}

message ReqSiteDomainVerify {
  int64 site_iid = 1;
  int64 domain_id = 2;
  bool force_tls = 3; // re-run cert-manager ensure when DNS already verified
}

message ResSiteDomainVerify {
  bool dns_verified = 1;
  string error = 2;
  string tls_status = 3;
}

message SiteDomainSearchHit {
  string name = 1;
  bool registrable = 2;
  string reason = 3;
  string registration_cost = 4;
  string currency = 5;
}

message ReqSiteDomainSearch {
  int64 site_iid = 1;
  string query = 2;
}

message ResSiteDomainSearch {
  repeated SiteDomainSearchHit hits = 1;
}

message ReqSiteDomainCheck {
  int64 site_iid = 1;
  repeated string hostnames = 2;
}

message ResSiteDomainCheck {
  repeated SiteDomainSearchHit hits = 1;
}

message ReqSiteDomainBuy {
  int64 site_iid = 1;
  string hostname = 2;
}

message ResSiteDomainBuy {
  SiteDomain domain = 1;
  string error = 2;
}

message ReqSitePreviewToken {
  int64 site_iid = 1;
  int32 ttl_secs = 2; // default 300
}

message ResSitePreviewToken {
  string token = 1;
  int64 expires_ts_ms = 2;
}

message ReqSiteHandlePut {
  int64 site_iid = 1;
  string new_alien_id = 2;
}

message ResSiteHandlePut {
  int64 site_iid = 1;
  string alien_id = 2;
  string url = 3;
}

// ================================= Guest boot (Flutter + preview hydration)

enum SiteBootMode {
  SITE_BOOT_MODE_UNSPECIFIED = 0;
  SITE_BOOT_MODE_DRAFT = 1;
  SITE_BOOT_MODE_PUBLISHED = 2;
}

message ReqSiteBootGet {
  int64 site_iid = 1;
  SiteBootMode mode = 2;
}

message ResSiteBootGet {
  string boot_json = 1;
}

// ================================= Query catalog (site.query.run)

message SiteQueryRow {
  int64 site_iid = 1;
  string site_name = 2;
  map<string, string> cells = 3;
}

message ReqSiteQueryRun {
  string query_id = 1;
  repeated int64 site_iids = 2;   // empty → all sites from MentionContext
  string params_json = 3;         // validated per QueryDef
}

message ResSiteQueryRun {
  repeated SiteQueryRow rows = 1;
  string result_json = 2;         // optional structured blob
}

// ================================= Guest Contact Lead Capture

message ReqSiteGuestContactPut {
  int64 site_iid = 1;
  string name = 2;
  string contact_val = 3;  // phone or email
  string message = 4;
  string meta_json = 5;
}

message ResSiteGuestContactPut {
  bool ok = 1;
  int64 contact_id = 2;
  string error = 3;
}

// ================================= Guest product catalog (pagination)

message SiteGuestProductItem {
  int64 product_id = 1;
  string name = 2;
  string desc = 3;
  int64 price = 4;
  string pic = 5;
  string category = 6;
  string icon = 7; // iconify id when pic is empty; empty when pic is set
}

message ReqSiteGuestProductList {
  int64 site_iid = 1;
  string filter = 2;
  string category = 3;
  string cursor = 4;
  int32 limit = 5;
}

message ResSiteGuestProductList {
  repeated SiteGuestProductItem items = 1;
  string next_cursor = 2;
}

// ================================= Staff grants (identity_grant on site_iid)

message SiteGrant {
  int64 site_iid = 1;
  int64 grantee_iid = 2;
  string grantee_alien_id = 3;
  string grantee_name = 4;
  string role = 5;

  int64 created_ts_ms = 20;
  int64 updated_ts_ms = 21;
}

message ReqSiteGrantList {
  int64 site_iid = 1;
}

message ResSiteGrantList {
  repeated SiteGrant grants = 1;
}

message ReqSiteGrantPut {
  int64 site_iid = 1;
  int64 grantee_iid = 2;
  string grantee_alien_id = 3;
  string role = 4;
}

message ResSiteGrantPut {
  int64 grantee_iid = 1;
  bool ok = 2;
}

message ReqSiteGrantDelete {
  int64 site_iid = 1;
  int64 grantee_iid = 2;
}

message ResSiteGrantDelete {
  int64 grantee_iid = 1;
  bool ok = 2;
}

// ================================= Queue admin (site.queue)

message SiteQueue {
  int64 site_iid = 1;
  int64 queue_id = 2;
  int64 owner_iid = 3;
  string name = 4;
  string mode = 5;
  string prefix = 6;
  int32 last_ticket_no = 7;
  int32 serving_ticket_no = 8;
  bool is_active = 9;
  string meta_json = 10;

  int64 created_ts_ms = 20;
  int64 updated_ts_ms = 21;
  int64 deleted_ts_ms = 22;
}

message ReqSiteQueueList {
  int64 site_iid = 1;
}

message ResSiteQueueList {
  repeated SiteQueue queues = 1;
}

message ReqSiteQueuePut {
  int64 site_iid = 1;
  SiteQueue queue = 2;
}

message ResSiteQueuePut {
  int64 queue_id = 1;
}

message ReqSiteQueueAdvance {
  int64 site_iid = 1;
  int64 queue_id = 2;
}

message ResSiteQueueAdvance {
  int32 serving_ticket_no = 1;
}

