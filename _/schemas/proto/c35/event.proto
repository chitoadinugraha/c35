syntax = "proto3";

package c35;

message Event {
  int64 id = 1;
  string event_kind = 2;
  string class = 3;
  string subject = 4;
  int64 owner_iid = 5;
  string dv = 6;
  string slug = 7;
  string text = 8;
  string meta_json = 9;
  int64 created_ts_ms = 10;
}

message EventPush {
  Event event = 1;
}

message EventUserSession {
  string method = 1;
  string platform = 2;
  int64 app_build = 3;
  int64 sess_id = 4;
  int64 conn_id = 5;
}

message EventConsumptionMeal {
  int64 consumption_id = 1;
  string day_id = 2;
  int32 item_count = 3;
  int32 calories = 4;
  string source = 5;
  string meal_fingerprint = 6;
}
