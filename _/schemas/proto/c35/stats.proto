syntax = "proto3";

package c35;

message DiskMountStat {
  string label = 1;
  string mount = 2;
  uint64 used_bytes = 3;
  uint64 total_bytes = 4;
  double read_bps = 5;
  double write_bps = 6;
}

message DiskDeviceStat {
  string device = 1;
  string mount = 2;
  string label = 3;
  bool is_boot = 4;
  uint64 used_bytes = 5;
  uint64 total_bytes = 6;
  double read_bps = 7;
  double write_bps = 8;
}

message VolumeStat {
  string namespace = 1;
  string pvc_name = 2;
  string pod_name = 3;
  string node_name = 4;
  uint64 used_bytes = 5;
  uint64 capacity_bytes = 6;
  string storage_class = 7;
  string label = 8;
}

message NodeStat {
  string node_name = 1;
  int32 cpu_cores = 2;
  double cpu_pct = 3;
  uint64 mem_used_bytes = 4;
  uint64 mem_total_bytes = 5;
  repeated DiskMountStat mounts = 6;
  double net_in_bps = 7;
  double net_out_bps = 8;
  int64 ts_ms = 9;
  repeated DiskDeviceStat devices = 10;
  uint64 swap_used_bytes = 11;
  uint64 swap_total_bytes = 12;
}

message StatsPush {
  oneof body {
    NodeStat node = 1;
    VolumeStat volume = 2;
  }
}

message ReqStatsSubscribe {}
message ReqStatsUnsubscribe {}

message ReqLogSubscribe {
  optional int64 owner_iid = 1;
}

message ReqLogUnsubscribe {}

message OpsMetric1mRow {
  int64 ts_min_ms = 1;
  string entity_type = 2;
  string entity_id = 3;
  string node_name = 4;
  optional double cpu_max = 5;
  optional int64 mem_used_max = 6;
  optional double net_in_max = 7;
  optional double net_out_max = 8;
  optional string disk_device = 9;
  optional int64 disk_used_last = 10;
  optional int64 disk_total_last = 11;
  optional string vol_namespace = 12;
  optional string vol_pvc = 13;
  optional int64 vol_used_last = 14;
  optional int64 vol_capacity_last = 15;
}

message ReqAdminOpsPeaks {
  int64 since_ms = 1;
  int64 until_ms = 2;
  optional string entity_type = 3;
  optional string node_name = 4;
}

message ResAdminOpsPeaks {
  repeated OpsMetric1mRow rows = 1;
  double peak_cpu_max = 2;
  double peak_mem_pct_max = 3;
}
