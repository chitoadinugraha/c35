[workspace]
resolver = "2"
members = ["c_node_stats"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AlienAI"]

[workspace.dependencies]
anyhow = "1"
async-nats = "0.38"
libc = "0.2"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
