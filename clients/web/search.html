<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search — Alien AI</title>
  <link rel="icon" href="/apple-touch-icon.png" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090b;
      --surface: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #71717a;
      --accent: #34d399;
      --accent-dim: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 20px 40px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(52, 211, 153, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(16, 185, 129, 0.06), transparent);
    }
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow:
        0 0 0 1px rgba(52, 211, 153, 0.25),
        0 12px 40px rgba(0, 0, 0, 0.45),
        0 0 48px rgba(52, 211, 153, 0.15);
      margin-bottom: 16px;
    }
    .brand h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand .tagline {
      margin: 6px 0 0;
      font-size: 14px;
      color: var(--muted);
    }
    .card {
      width: min(480px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 28px;
    }
    .card h2 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
    .muted { color: var(--muted); font-size: 13px; }
    .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .pill {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #27272a;
      color: #a1a1aa;
    }
    .search-wrap {
      width: min(580px, 100%);
      display: flex;
      align-items: stretch;
      gap: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 6px 5px 6px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-wrap:focus-within {
      border-color: rgba(52, 211, 153, 0.55);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), 0 0 0 3px rgba(52, 211, 153, 0.12);
    }
    .engine-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .engine-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      border: none;
      background: #27272a;
      color: #e4e4e7;
      border-radius: 999px;
      padding: 8px 12px 8px 10px;
      font-size: 12px;
      cursor: pointer;
      max-width: 148px;
      height: 100%;
    }
    .engine-btn:hover { background: #3f3f46; }
    .engine-btn img {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .engine-btn .chev {
      width: 14px;
      height: 14px;
      opacity: 0.6;
      margin-left: 2px;
    }
    .engine-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 200px;
      background: #1c1c1f;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px;
      z-index: 20;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
    }
    .engine-menu.open { display: block; }
    .engine-opt {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: none;
      background: transparent;
      color: #f4f4f5;
      font-size: 13px;
      padding: 10px 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
    }
    .engine-opt:hover, .engine-opt[aria-selected="true"] {
      background: #27272a;
    }
    .engine-opt img {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }
    #q {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      outline: none;
      min-width: 0;
      padding: 10px 12px;
    }
    #go {
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      color: #042f1a;
      font-weight: 600;
      border-radius: 999px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 14px;
      flex-shrink: 0;
    }
    #go:hover { filter: brightness(1.06); }
    .hint { margin-top: 16px; font-size: 12px; color: #52525b; text-align: center; max-width: 420px; line-height: 1.5; }
    @media (max-width: 520px) {
      .engine-btn span.label { display: none; }
      .engine-btn { padding: 8px 10px; max-width: none; }
    }

    .agent-dock {
      width: min(580px, 100%);
      margin-top: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      display: none;
    }
    .agent-dock.visible { display: block; }
    .agent-dock h3 { margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .agent-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 13px; }
    .agent-row .label { color: var(--muted); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .status-dot.on { background: var(--accent); box-shadow: 0 0 8px rgba(52,211,153,0.6); }
    .status-dot.off { background: #71717a; }

  </style>
</head>
<body>
  <header class="brand">
    <img class="logo" src="/apple-touch-icon.png" width="80" height="80" alt="Alien AI" />
    <h1>Alien AI</h1>
    <p class="tagline" id="brandTagline">Search the web</p>
  </header>
  <form class="search-wrap" id="searchForm">
    <div class="engine-wrap">
      <button type="button" class="engine-btn" id="engineBtn" aria-haspopup="listbox" aria-expanded="false">
        <img id="engineIcon" src="" alt="" width="18" height="18" />
        <span class="label" id="engineLabel">Google</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="engine-menu" id="engineMenu" role="listbox" aria-label="Search engine"></div>
    </div>
    <input id="q" type="search" autocomplete="off" placeholder="Search or enter URL" aria-label="Search" />
    <button type="submit" id="go">Go</button>
  </form>
  <p class="hint" id="publicHint">Search the web with Alien AI. Sign in to the app for quota and billing.</p>
  <aside class="agent-dock" id="agentDock" aria-label="Remote browser agent">
    <h3>Remote browser agent</h3>
    <div class="agent-row"><span class="label">Alien AI Cloud</span><span id="cloudStatus">—</span></div>
    <div class="agent-row"><span class="label">Account</span><span id="accountLine">—</span></div>
    <div class="agent-row"><span class="label">Package</span><span id="packageLine">—</span></div>
    <div class="agent-row"><span class="label">Device</span><span id="deviceLine">—</span></div>
    <div class="agent-row"><span class="label">Agent</span><span id="agentLine">—</span></div>
  </aside>
  <script>
    const ENGINES = [
      { id: 'google', name: 'Google', url: 'https://www.google.com/search?q={q}', icon: 'https://www.google.com/s2/favicons?domain=google.com&sz=32' },
      { id: 'duckduckgo', name: 'DuckDuckGo', url: 'https://duckduckgo.com/?q={q}', icon: 'https://www.google.com/s2/favicons?domain=duckduckgo.com&sz=32' },
      { id: 'brave', name: 'Brave', url: 'https://search.brave.com/search?q={q}', icon: 'https://www.google.com/s2/favicons?domain=search.brave.com&sz=32' },
      { id: 'bing', name: 'Bing', url: 'https://www.bing.com/search?q={q}', icon: 'https://www.google.com/s2/favicons?domain=bing.com&sz=32' },
      { id: 'wikipedia', name: 'Wikipedia', url: 'https://en.wikipedia.org/w/index.php?search={q}', icon: 'https://www.google.com/s2/favicons?domain=wikipedia.org&sz=32' },
    ];
    const ENGINE_KEY = 'c35.browser.search_engine';
    const engineMenu = document.getElementById('engineMenu');
    const engineBtn = document.getElementById('engineBtn');
    const engineIcon = document.getElementById('engineIcon');
    const engineLabel = document.getElementById('engineLabel');
    let engineId = localStorage.getItem(ENGINE_KEY) || localStorage.getItem('c35.browser.engine') || 'google';

    function engineById(id) {
      return ENGINES.find((e) => e.id === id) || ENGINES[0];
    }

    function setEngine(id) {
      engineId = id;
      localStorage.setItem(ENGINE_KEY, id);
      localStorage.setItem('c35.browser.engine', id);
      const e = engineById(id);
      engineIcon.src = e.icon;
      engineIcon.alt = e.name;
      engineLabel.textContent = e.name;
      for (const btn of engineMenu.querySelectorAll('.engine-opt')) {
        btn.setAttribute('aria-selected', btn.dataset.id === id ? 'true' : 'false');
      }
    }

    for (const e of ENGINES) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'engine-opt';
      btn.dataset.id = e.id;
      btn.role = 'option';
      btn.innerHTML = `<img src="${e.icon}" alt="" width="20" height="20" /><span>${e.name}</span>`;
      btn.addEventListener('click', () => {
        setEngine(e.id);
        engineMenu.classList.remove('open');
        engineBtn.setAttribute('aria-expanded', 'false');
      });
      engineMenu.appendChild(btn);
    }
    setEngine(engineId);

    engineBtn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const open = engineMenu.classList.toggle('open');
      engineBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('click', () => {
      engineMenu.classList.remove('open');
      engineBtn.setAttribute('aria-expanded', 'false');
    });

    function looksLikeUrl(t) {
      if (/\s/.test(t)) return false;
      if (/^https?:\/\//i.test(t)) return true;
      if (t === 'localhost' || t.startsWith('localhost:') || t.startsWith('127.0.0.1')) return true;
      return /^[a-zA-Z0-9][\w.-]*\.[a-zA-Z]{2,}([/:?#].*)?$/.test(t);
    }

    function targetUrl(raw) {
      const t = raw.trim();
      if (!t) return '';
      if (t === 'about:home' || t === 'about:blank') return '';
      if (looksLikeUrl(t)) {
        if (/^https?:\/\//i.test(t)) return t;
        return 'https://' + t;
      }
      const eng = engineById(engineId);
      return eng.url.replace('{q}', encodeURIComponent(t));
    }

    document.getElementById('searchForm').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const url = targetUrl(document.getElementById('q').value);
      if (url) window.location.href = url;
    });

    function renderRemoteBrowser(ctx) {
      if (!ctx || typeof ctx !== 'object') return;
      const dock = document.getElementById('agentDock');
      const hint = document.getElementById('publicHint');
      if (hint) hint.hidden = true;
      dock.classList.add('visible');
      const online = ctx.cloudOnline === true;
      document.getElementById('cloudStatus').innerHTML =
        '<span class="status-dot ' + (online ? 'on' : 'off') + '"></span>' + (online ? 'Connected' : 'Offline');
      const acct = [];
      if (ctx.userName) acct.push(ctx.userName);
      if (ctx.alienId) acct.push('@' + ctx.alienId);
      document.getElementById('accountLine').textContent = acct.length ? acct.join(' · ') : '—';
      document.getElementById('packageLine').textContent = ctx.packageName || '—';
      document.getElementById('deviceLine').textContent = ctx.deviceName || 'Remote browser';
      document.getElementById('agentLine').textContent = ctx.agentVersion || '—';
      if (ctx.userName) document.getElementById('brandTagline').textContent = ctx.userName;
      else if (ctx.alienId) document.getElementById('brandTagline').textContent = '@' + ctx.alienId;
    }
    window.addEventListener('c35-remote-browser-context', (ev) => renderRemoteBrowser(ev.detail));
    if (window.__C35_REMOTE_BROWSER__) renderRemoteBrowser(window.__C35_REMOTE_BROWSER__);
  </script>
</body>
</html>
