<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Status — Alien AI</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/alien.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 300: '#5df2be', 400: '#22ec9e', 500: '#00e599', 600: '#00b87a' },
            dark: { bg: '#0f1014', surface: '#15161e', card: '#181924', border: '#262838' }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-dark-bg text-slate-200 font-sans antialiased min-h-screen flex flex-col selection:bg-brand-500 selection:text-black">

  <header class="sticky top-0 z-50 backdrop-blur-xl bg-dark-bg/85 border-b border-white/5">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5 group">
        <div class="w-7 h-7 rounded-lg bg-white/10 border border-white/20 flex items-center justify-center group-hover:border-white/40 transition">
          <img src="/alien.svg" alt="Alien AI" class="w-3.5 h-3.5">
        </div>
        <div class="flex items-center gap-2">
          <span class="text-base font-bold tracking-tight text-white">Alien<span class="text-white font-black">AI</span></span>
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-white/10 text-slate-300 font-mono" data-i18n="status.badge">Status</span>
        </div>
      </a>
      <div class="flex items-center gap-3 text-xs">
        <span id="liveTime" class="hidden sm:inline-block font-mono text-slate-400">--:--:--</span>
        <a href="/" class="px-2.5 py-1 rounded-md bg-white/10 hover:bg-white/20 text-white transition text-xs" data-i18n="status.back">Back</a>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 py-8 w-full">

    <div id="overallBanner" class="p-4 sm:p-5 rounded-xl border mb-6 flex items-center justify-between gap-3 bg-emerald-500/10 border-emerald-500/25">
      <div class="flex items-center gap-3">
        <div id="overallDotWrap" class="relative flex items-center justify-center w-8 h-8 rounded-full bg-emerald-500/20 shrink-0">
          <span id="overallPing" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping absolute"></span>
          <span id="overallDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
        </div>
        <div>
          <h1 id="overallTitle" class="text-base sm:text-lg font-bold text-white tracking-tight" data-i18n="status.checking">Checking systems…</h1>
          <p id="overallSub" class="text-xs text-emerald-400/80" data-i18n="status.probeInterval">Live probes every 60 seconds</p>
        </div>
      </div>
      <div class="text-right font-mono shrink-0">
        <div class="text-[10px] text-slate-400 uppercase tracking-wider" data-i18n="status.lastChecked">Last checked</div>
        <div id="lastChecked" class="text-base sm:text-lg font-bold text-white">—</div>
      </div>
    </div>

    <div id="servicesList" class="rounded-xl bg-dark-card/70 border border-white/5 divide-y divide-white/5 overflow-hidden mb-6">
      <div class="px-4 py-6 sm:px-5 text-center text-sm text-slate-400" data-i18n="status.loading">Loading service status…</div>
    </div>

    <div class="p-4 rounded-xl bg-dark-card/50 border border-white/5">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold uppercase tracking-wider font-mono text-slate-400" data-i18n="status.incidents">Past Incidents</span>
        <span class="text-[11px] text-slate-500 font-mono" data-i18n="status.notTracked">Not tracked yet</span>
      </div>
      <p class="text-xs text-slate-400" data-i18n="status.incidentsDesc">Incident history will appear here once automated uptime tracking is enabled.</p>
    </div>

  </main>

  <footer class="border-t border-white/5 py-6 bg-dark-bg text-slate-500 text-xs mt-auto">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-x-2.5 gap-y-1 leading-none">
        <img src="/alien.svg" alt="" class="w-4 h-4 shrink-0" aria-hidden="true">
        <span class="font-bold text-white shrink-0">AlienAI</span>
        <span class="hidden sm:inline text-slate-600 shrink-0" aria-hidden="true">·</span>
        <span class="text-slate-500" data-i18n="footer.rights">© 2026 AlienAI. All rights reserved.</span>
      </div>
      <div class="flex items-center gap-4 text-slate-400">
        <a href="/terms.html" class="hover:text-white transition" data-i18n="footer.terms">Terms</a>
        <a href="/privacy.html" class="hover:text-white transition" data-i18n="footer.privacy">Privacy</a>
        <a href="/" class="hover:text-white transition" data-i18n="status.home">Home</a>
      </div>
    </div>
  </footer>

  <script>
    let currentLang = 'en';
    const localeCache = {};

    async function loadLocale(lang) {
      if (localeCache[lang]) return localeCache[lang];
      try {
        const res = await fetch('/locales/' + lang + '.json');
        if (!res.ok) return null;
        const data = await res.json();
        localeCache[lang] = data;
        return data;
      } catch (_) { return null; }
    }

    async function applyLocale(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      const dict = await loadLocale(lang);
      if (!dict) return;
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) el.textContent = dict[key];
      });
      STATUS_STYLE.operational.label = dict['status.operational'] || 'Operational';
      STATUS_STYLE.operational.title = dict['status.allOperational'] || 'All Systems Operational';
      STATUS_STYLE.degraded.label = dict['status.degraded'] || 'Degraded';
      STATUS_STYLE.degraded.title = dict['status.partialDegradation'] || 'Partial System Degradation';
      STATUS_STYLE.outage.label = dict['status.outage'] || 'Outage';
      STATUS_STYLE.outage.title = dict['status.outageDetected'] || 'Service Outage Detected';
    }

    async function initLang() {
      const urlLang = new URLSearchParams(window.location.search).get('lang');
      const savedLang = localStorage.getItem('alienai_lang');
      const cookieLang = (document.cookie.match(/alienai_lang=([^;]+)/) || [])[1];
      let initial = urlLang || savedLang || cookieLang;
      if (!initial) {
        try {
          const res = await fetch('/locale/detect');
          if (res.ok) { const d = await res.json(); initial = d.lang; }
        } catch (_) {}
      }
      await applyLocale(initial === 'id' ? 'id' : 'en');
    }

    const STATUS_STYLE = {
      operational: { dot: 'bg-emerald-400', ping: 'bg-emerald-400', wrap: 'bg-emerald-500/20', badge: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20', banner: 'bg-emerald-500/10 border-emerald-500/25', sub: 'text-emerald-400/80', label: 'Operational', title: 'All Systems Operational' },
      degraded: { dot: 'bg-amber-400', ping: 'bg-amber-400', wrap: 'bg-amber-500/20', badge: 'bg-amber-500/10 text-amber-400 border-amber-500/20', banner: 'bg-amber-500/10 border-amber-500/25', sub: 'text-amber-400/80', label: 'Degraded', title: 'Partial System Degradation' },
      outage: { dot: 'bg-red-400', ping: 'bg-red-400', wrap: 'bg-red-500/20', badge: 'bg-red-500/10 text-red-400 border-red-500/20', banner: 'bg-red-500/10 border-red-500/25', sub: 'text-red-400/80', label: 'Outage', title: 'Service Outage Detected' },
    };

    const LOCAL_TIME = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
    const fmtLocalTime = (d) => d.toLocaleTimeString(undefined, LOCAL_TIME);
    const updateClock = () => { const el = document.getElementById('liveTime'); if (el) el.textContent = fmtLocalTime(new Date()); };
    const fmtChecked = (iso) => iso ? fmtLocalTime(new Date(iso)) : '—';
    const escapeHtml = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    function renderOverall(data) {
      const overall = (data && data.overall) || 'outage';
      const style = STATUS_STYLE[overall] || STATUS_STYLE.outage;
      const banner = document.getElementById('overallBanner');
      banner.className = 'p-4 sm:p-5 rounded-xl border mb-6 flex items-center justify-between gap-3 ' + style.banner;
      document.getElementById('overallDotWrap').className = 'relative flex items-center justify-center w-8 h-8 rounded-full shrink-0 ' + style.wrap;
      document.getElementById('overallDot').className = 'w-2.5 h-2.5 rounded-full ' + style.dot;
      document.getElementById('overallPing').className = 'w-2.5 h-2.5 rounded-full animate-ping absolute ' + style.ping;
      document.getElementById('overallTitle').textContent = style.title;
      document.getElementById('overallSub').className = 'text-xs ' + style.sub;
      document.getElementById('overallSub').textContent = overall === 'operational'
        ? (localeCache[currentLang]?.['status.probeLive'] || 'Live probes across core services')
        : (localeCache[currentLang]?.['status.probeAttention'] || 'Some dependencies need attention');
      document.getElementById('lastChecked').textContent = fmtChecked(data && data.updatedAt);
    }

    function renderServices(components) {
      const list = document.getElementById('servicesList');
      if (!components || !components.length) {
        list.innerHTML = '<div class="px-4 py-6 sm:px-5 text-center text-sm text-red-400">' + (localeCache[currentLang]?.['status.loadFailed'] || 'Could not load service status.') + '</div>';
        return;
      }
      list.innerHTML = components.map((c) => {
        const style = STATUS_STYLE[c.status] || STATUS_STYLE.outage;
        const latency = c.latencyMs != null ? c.latencyMs + 'ms' : '—';
        return '<div class="px-4 py-3.5 sm:px-5 flex items-center justify-between gap-4 hover:bg-white/[0.02] transition">' +
          '<div class="flex items-center gap-3 min-w-0"><span class="w-2 h-2 rounded-full shrink-0 ' + style.dot + '"></span>' +
          '<div><div class="font-semibold text-white text-xs sm:text-sm">' + escapeHtml(c.name) + '</div>' +
          '<div class="text-[11px] text-slate-400">' + escapeHtml(c.description) + '</div></div></div>' +
          '<div class="flex items-center gap-3 text-xs font-mono shrink-0">' +
          '<span class="hidden sm:inline text-slate-400">' + latency + '</span>' +
          '<span class="px-2 py-0.5 rounded border text-[11px] ' + style.badge + '">' + style.label + '</span></div></div>';
      }).join('');
    }

    async function refreshStatus() {
      try {
        const res = await fetch('/v1/system/status', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        renderOverall(data);
        renderServices(data.components);
      } catch (_) {
        renderOverall({ overall: 'outage', updatedAt: null });
        document.getElementById('servicesList').innerHTML =
          '<div class="px-4 py-6 sm:px-5 text-center text-sm text-red-400">' + (localeCache[currentLang]?.['status.apiFailed'] || 'Could not reach status API. Try again shortly.') + '</div>';
      }
    }

    initLang().then(() => { refreshStatus(); });
    updateClock();
    setInterval(updateClock, 1000);
    setInterval(refreshStatus, 60000);
  </script>
</body>
</html>
