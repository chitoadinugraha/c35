<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alien AI Remote</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      width: 380px;
      padding: 14px;
      background: #0f1014;
      color: #e2e8f0;
    }
    h1 { font-size: 15px; margin: 0 0 8px; color: #fff; display: flex; align-items: center; gap: 8px; }
    h1 img { width: 20px; height: 20px; border-radius: 4px; }
    p.sub { font-size: 12px; line-height: 1.45; color: #94a3b8; margin: 0 0 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
      color: #94a3b8;
      font-size: 11px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #status {
      font-size: 11px;
      font-family: ui-monospace, monospace;
      padding: 8px;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 10px;
    }
    #pairPanel {
      display: none;
      margin-bottom: 8px;
      padding: 14px 12px;
      border-radius: 10px;
      background: rgba(0,229,153,0.06);
      border: 1px solid rgba(0,229,153,0.2);
    }
    #pairPanel.active { display: block; }
    #pairCode {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-align: center;
      color: #fff;
      margin: 2px 0 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      min-height: 32px;
    }
    #pairHint {
      font-size: 11px;
      text-align: center;
      color: #94a3b8;
      margin: 0 0 12px;
      line-height: 1.45;
    }
    .progress-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      overflow: hidden;
    }
    #pairProgress {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #00e599, #34d399);
      transition: width 0.35s linear;
    }
    #pairedPanel {
      display: none;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(52,211,153,0.08);
      border: 1px solid rgba(52,211,153,0.25);
      font-size: 12px;
      color: #34d399;
      text-align: center;
      margin-bottom: 8px;
    }
    #pairedPanel.active { display: block; }
    #diagPanel {
      margin-top: 4px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }
    #diagPanel h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      margin: 0 0 8px;
    }
    .status-grid { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .status-row .label { flex: 1; color: #cbd5e1; }
    .status-row .detail { font-size: 10px; color: #64748b; max-width: 140px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #475569;
    }
    .dot.on { background: #34d399; box-shadow: 0 0 6px rgba(52,211,153,0.5); }
    .dot.warn { background: #fbbf24; }
    .dot.off { background: #64748b; }
    .dot.err { background: #f87171; }
    #logTail {
      margin: 0;
      padding: 8px;
      height: 120px;
      overflow: auto;
      font-size: 10px;
      line-height: 1.35;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #94a3b8;
      background: #0a0b0e;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .ok { color: #34d399; }
    .warn { color: #fbbf24; }
    .err { color: #f87171; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h1><img src="../icons/icon32.png" alt="" width="20" height="20"> Alien AI Remote</h1>
  <p class="sub" id="subtitle">Remote your daily Chrome profile from Alien AI → Devices.</p>
  <div id="pairedPanel">Paired — open <strong>Devices → Remote</strong> in the app.</div>
  <div id="pairPanel">
    <div id="pairCode">··· ···</div>
    <p id="pairHint">Enter this code in the Alien AI app<br><strong>Devices → Pair with Code</strong></p>
    <div class="progress-track"><div id="pairProgress"></div></div>
  </div>
  <div id="status" class="hidden"></div>
  <div id="diagPanel">
    <h2>Connection</h2>
    <div class="status-grid">
      <div class="status-row">
        <span class="dot off" id="dotNative"></span>
        <span class="label">Native host</span>
        <span class="detail" id="detailNative">—</span>
      </div>
      <div class="status-row">
        <span class="dot off" id="dotAgent"></span>
        <span class="label">Chrome agent (IPC)</span>
        <span class="detail" id="detailAgent">—</span>
      </div>
      <div class="status-row">
        <span class="dot off" id="dotCloud"></span>
        <span class="label">Alien AI Cloud</span>
        <span class="detail" id="detailCloud">—</span>
      </div>
      <div class="status-row">
        <span class="dot off" id="dotWebrtc"></span>
        <span class="label">WebRTC</span>
        <span class="detail" id="detailWebrtc">—</span>
      </div>
    </div>
    <h2>Logs <span id="logMoreHint" style="font-weight:400;text-transform:none;letter-spacing:0;color:#64748b;font-size:10px;"></span></h2>
    <pre id="logTail"></pre>
    <div class="row">
      <button type="button" id="btnRefresh">Refresh</button>
      <button type="button" id="btnCopyLogs">Copy logs</button>
      <button type="button" id="btnPing" class="secondary">Test native host</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
