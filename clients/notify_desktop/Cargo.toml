[package]
name = "alienai_notify"
version = "0.1.0"
edition = "2021"
description = "User-session Windows notify helper (WS + IPC for Flutter)"

[[bin]]
name = "alienai_notify"
path = "src/main.rs"

[dependencies]
anyhow = "1"
c35_proto = { path = "../../servers/crates/proto" }
futures-util = "0.3"
hostname = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_UI_Shell",
] }
