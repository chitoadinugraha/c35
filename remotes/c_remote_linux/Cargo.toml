[package]
name = "c_remote_linux"
version.workspace = true
edition.workspace = true
description = "c35 remote agent for Linux"

[[bin]]
name = "c_remote_linux"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
c_remote_core = { path = "../c_remote_core" }
c_remote_drive = { path = "../c_remote_drive", default-features = false }
futures-util = { workspace = true }
hostname = "0.4"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
jpeg-encoder = "0.7"
bytes = "1"
webrtc = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio"] }
enigo = "0.2"
enumflags2 = "0.7"
libc = "0.2"
pipewire = "0.8"
reis = { version = "0.7", optional = true }
xcap = "0.0.14"
zbus = { version = "4", default-features = false, features = ["tokio"] }

[features]
default = ["reis-libei"]
reis-libei = ["dep:reis"]
