[package]
name = "c_remote_drive"
version.workspace = true
edition.workspace = true
description = "Alien AI Drive (A:) sync and mount for Windows agent"

[features]
default = ["winfsp"]
winfsp = ["dep:winfsp", "dep:winfsp-sys", "dep:widestring"]

[dependencies]
anyhow = { workspace = true }
blake3 = { workspace = true }
c_remote_core = { path = "../c_remote_core" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
winfsp = { version = "0.13", optional = true }
winfsp-sys = { version = "0.12", optional = true }
widestring = { version = "1", optional = true }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tempfile = "3"