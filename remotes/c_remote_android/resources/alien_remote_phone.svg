<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Phone Bezel Gradient -->
    <linearGradient id="phoneBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Screen Emerald Glow Rim -->
    <linearGradient id="emeraldRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Red Dot Glow Filter -->
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Squircle App Icon Base -->
  <rect width="512" height="512" rx="116" ry="116" fill="url(#bgGrad)"/>

  <!-- 2. Phone Remote Device Body (Behind the Alien Logo) -->
  <!-- Outer Bezel -->
  <rect x="86" y="44" width="340" height="424" rx="46" ry="46" fill="url(#phoneBezel)" stroke="#334155" stroke-width="3"/>

  <!-- Phone Screen Area -->
  <rect x="100" y="58" width="312" height="396" rx="36" ry="36" fill="#030712" stroke="url(#emeraldRim)" stroke-width="2.5"/>

  <!-- Top Speaker / Dynamic Island Notch -->
  <rect x="220" y="70" width="72" height="10" rx="5" ry="5" fill="#1E293B"/>

  <!-- 3. Concept B Remote Viewfinder Reticle Brackets -->
  <g stroke="#10B981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-Left -->
    <path d="M 124 116 L 124 92 L 148 92"/>
    <!-- Top-Right -->
    <path d="M 364 92 L 388 92 L 388 116"/>
    <!-- Bottom-Left -->
    <path d="M 124 396 L 124 420 L 148 420"/>
    <!-- Bottom-Right -->
    <path d="M 364 420 L 388 420 L 388 396"/>
  </g>

  <!-- 4. Red Remote Session / Action Indicator Dot -->
  <circle cx="360" cy="92" r="7" fill="#EF4444" filter="url(#redGlow)"/>

  <!-- 5. Official Alien AI Logo in Foreground (Centered) -->
  <!-- Scale 24x24 path to 230x230: scale = 9.58, centered at x=141, y=141 -->
  <g transform="translate(141, 141) scale(9.5833)">
    <path fill="#FFFFFF" fill-rule="evenodd" d="M12 3c4.97 0 9 3.58 9 8s-6 10-9 10s-9-5.58-9-10s4.03-8 9-8m-1.69 7.93C9.29 9.29 7.47 8.58 6.25 9.34s-1.38 2.71-.36 4.35c1.03 1.64 2.85 2.35 4.07 1.59c1.22-.78 1.37-2.71.35-4.35m3.38 0c-1.02 1.64-.87 3.57.35 4.35c1.22.76 3.04.05 4.07-1.59c1.02-1.64.86-3.59-.36-4.35s-3.04-.05-4.06 1.59M12 17.75c-2 0-2.5-.75-2.5-.75c0 .03.5 2 2.5 2s2.5-2 2.5-2s-.5.75-2.5.75"/>
  </g>

  <!-- Subtle Bottom Home Indicator Bar on the phone -->
  <rect x="206" y="434" width="100" height="4" rx="2" ry="2" fill="#334155"/>
</svg>
