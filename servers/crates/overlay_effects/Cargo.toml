[package]
name = "overlay_effects"
version = "0.1.0"
edition = "2021"
description = "Full-viewport overlay effect particle engine (WASM + cdylib)"

[lib]
crate-type = ["cdylib", "rlib"]

# Own workspace so this crate stays out of servers/Cargo.toml members.
[workspace]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
