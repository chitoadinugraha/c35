[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/store",
    "crates/wire",
    "crates/wire_ws",
    "crates/wire_http",
    "crates/system/ctx",
    "crates/system/trace",
    "crates/mod_identity",
    "crates/mod_billing",
    "server_ai",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AlienAI"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
dotenvy = "0.15"
futures-util = "0.3"
jsonwebtoken = "9"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono"] }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"

[profile.dev]
debug = 1
split-debuginfo = "unpacked"
